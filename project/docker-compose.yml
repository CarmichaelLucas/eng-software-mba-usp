services:
  auth_db:
    image: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: docker
      POSTGRES_DB: auth_api
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  auth_api:
    image: project/auth
    entrypoint: ./entrypoint.sh
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3131:3030"
    depends_on:
      - auth_db
    volumes:
      - ${PWD}/:/srv
    environment:
      DATABASE_URL: postgresql+asyncpg://docker:password@auth_db:5432/auth_api
      WAIT_FOR_DB: 1
      DB_HOST: auth_db
      DB_PORT: 5432

volumes:
  pgdata:
