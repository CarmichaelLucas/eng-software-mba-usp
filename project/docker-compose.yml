services:
  postgres:
    image: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: docker
      POSTGRES_DB: login_api
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  api:
    image: project/tcc
    entrypoint: ./entrypoint.sh
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3030:3030"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg://docker:password@postgres:5432/login_api

volumes:
  pgdata:
