server:
  http_listen_port: 3200

distributor:
  receivers: 
    otlp:
      protocols:
        grpc:
        http:

ingester:
  trace_idle_period: 10s
  max_block_duration: 5m

metrics_generator:
  processor:
    span_metrics:
      dimensions: [service, span_name, span_kind, status_code]
  registry:
    external_labels:
      source: tempo
  storage:
    path: /tmp/tempo
    remote_write:
      - url: http://otel:9090/api/v1/write
